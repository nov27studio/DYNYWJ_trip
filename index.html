<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도나윤이네 우진이네 여행플래너</title>
  <style>
    :root {
      --palette-sand-light: #f7f4ee;
      --palette-sand-gray: #b2b083;
      --palette-sand-tan: #c5a987;
      --palette-aqua: #16bcc2;
      --palette-green: #2d8259;
      --palette-green-dark: #216343;
      --palette-blue: #669bd8;
      
      --primary: var(--palette-green);
      --primary-hover: var(--palette-green-dark);
      --primary-light: #edf7f2;
      --accent: var(--palette-aqua);
      --bg: #f5f2eb;
      --card: #ffffff;
      --text: #1c2e26;
      --text-muted: #6b7c74;
      --border: #dfd9cc;
      --danger: #e05252;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* 해변 일러스트 헤더 */
    header {
      position: relative;
      background: linear-gradient(180deg, #669bd8 0%, #a2c6ee 45%, #e1edd8 75%, #c5a987 100%);
      color: white;
      padding: 45px 20px 75px;
      text-align: center;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 20px rgba(45, 130, 89, 0.15);
      overflow: hidden;
    }
    .header-content {
      position: relative;
      z-index: 3;
      text-shadow: 0 2px 8px rgba(0, 30, 20, 0.35);
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    header p {
      font-size: 0.92rem;
      font-weight: 600;
      color: #f8fafc;
      opacity: 0.95;
    }

    /* 해변 SVG 일러스트 레이어 */
    .beach-art {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 820px;
      margin: -30px auto 0;
      padding: 0 16px;
      position: relative;
      z-index: 4;
    }
    .section-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(45, 130, 89, 0.06);
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--palette-green);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      background: var(--palette-sand-light);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--text);
    }
    input:focus {
      border-color: var(--palette-aqua);
      box-shadow: 0 0 0 3px rgba(22, 188, 194, 0.15);
    }
    .btn {
      background: var(--palette-green);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:hover {
      background: var(--palette-green-dark);
    }
    .btn-accent {
      background: var(--palette-aqua);
    }
    .btn-accent:hover {
      background: #0ea1a7;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
    }
    .btn-danger {
      background: #fde8e8;
      color: var(--danger);
      border: 1px solid #fbd5d5;
    }
    .btn-danger:hover {
      background: #fbd5d5;
    }
    
    /* 테이블 (가로 스크롤 및 텍스트 줄바꿈 방지) */
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap; /* 모든 셀 줄바꿈 방지 */
    }
    th {
      background-color: var(--palette-sand-light);
      color: var(--palette-green);
      font-weight: 700;
    }
    
    /* 지역 배지 한줄 고정 */
    .region-tag {
      display: inline-block;
      white-space: nowrap;
      background: #eaf5f0;
      color: #216343;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      border: 1px solid #c9e6d8;
    }

    /* 숙소명 + 링크 아이콘 한줄 고정 */
    .acc-name-cell {
      white-space: nowrap;
    }
    .acc-name-cell a {
      color: #0d8b90;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .acc-name-cell a:hover {
      text-decoration: underline;
    }
    .price-tag {
      font-weight: 800;
      color: var(--palette-green);
      white-space: nowrap;
    }
    
    /* 투표 컨트롤러 */
    .vote-control {
      display: inline-flex;
      align-items: center;
      background: #f5f2eb;
      border-radius: 20px;
      padding: 2px 6px;
      gap: 4px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .vote-btn {
      background: white;
      border: 1px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--palette-green);
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .vote-btn:active {
      transform: scale(0.9);
    }
    .vote-btn:hover {
      background: var(--palette-sand-tan);
      color: white;
    }
    .vote-count {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      padding: 0 4px;
      min-width: 48px;
      justify-content: center;
    }

    /* 체크리스트 */
    .checklist {
      list-style: none;
    }
    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .check-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .check-item.done label {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--palette-aqua);
    }

    .share-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: var(--palette-green);
      box-shadow: 0 2px 8px rgba(45, 130, 89, 0.05);
    }
  </style>
</head>
<body>

  <!-- 해변 일러스트 헤더 -->
  <header>
    <svg class="beach-art" viewBox="0 0 800 240" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff5cc" />
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
        </linearGradient>
        <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16bcc2" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#2d8259" stop-opacity="0.8" />
        </linearGradient>
      </defs>

      <!-- 태양 및 구름 -->
      <circle cx="680" cy="50" r="32" fill="url(#sunGrad)" opacity="0.85" />
      <path d="M120 40 q20 -15 45 0 q25 -20 50 0 q20 15 0 25 h-95 z" fill="#ffffff" opacity="0.4" />
      <path d="M520 65 q15 -10 35 0 q20 -15 40 0 q15 10 0 20 h-75 z" fill="#ffffff" opacity="0.35" />

      <!-- 갈매기 -->
      <path d="M260 45 q10 -8 20 0 q10 -8 20 0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
      <path d="M295 55 q7 -6 14 0 q7 -6 14 0" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.5" />

      <!-- 바다 파도 레이어 1 -->
      <path d="M0 135 C150 120 280 145 420 130 C560 115 690 140 800 128 L800 240 L0 240 Z" fill="url(#seaGrad)" />

      <!-- 바다 파도 레이어 2 (에메랄드/아쿠아) -->
      <path d="M0 155 C120 140 240 165 390 150 C540 135 670 160 800 148 L800 240 L0 240 Z" fill="#16bcc2" opacity="0.75" />

      <!-- 해변 모래사장 (따뜻한 샌드 탄) -->
      <path d="M0 185 C180 165 340 195 520 175 C680 160 760 180 800 172 L800 240 L0 240 Z" fill="#c5a987" />
      <path d="M0 205 C150 190 320 215 500 198 C660 185 750 205 800 195 L800 240 L0 240 Z" fill="#afad7e" opacity="0.6" />

      <!-- 야자수 섬 실루엣 (좌측) -->
      <path d="M-20 200 Q40 175 100 240 Z" fill="#b2b083" />
      <!-- 야자수 줄기 -->
      <path d="M35 195 Q48 160 62 135" fill="none" stroke="#216343" stroke-width="5" stroke-linecap="round" />
      <!-- 야자수 잎 -->
      <path d="M62 135 Q35 125 20 138" fill="none" stroke="#2d8259" stroke-width="3" stroke-linecap="round" />
      <path d="M62 135 Q50 110 35 115" fill="none" stroke="#2d8259" stroke-width="3" stroke-linecap="round" />
      <path d="M62 135 Q75 110 90 118" fill="none" stroke="#2d8259" stroke-width="3" stroke-linecap="round" />
      <path d="M62 135 Q90 130 102 142" fill="none" stroke="#2d8259" stroke-width="3" stroke-linecap="round" />
    </svg>

    <div class="header-content">
      <h1>🌴 도나윤이네 우진이네 여행플래너</h1>
      <p>실시간 확인용 공유 보드 by leo</p>
    </div>
  </header>

  <div class="container">

    <div class="share-bar">
      <span>💡 브라우저에 자동 저장되며 모든 항목을 자유롭게 추가·수정할 수 있습니다.</span>
      <button class="btn btn-sm btn-accent" onclick="exportData()">데이터 내보내기</button>
    </div>

    <!-- 1. 숙소 후보 비교 및 투표 테이블 -->
    <div class="section-card">
      <div class="section-title">
        <span>🏨 숙소 & 펜션 후보 목록</span>
      </div>

      <!-- 숙소 추가 입력폼 -->
      <div class="form-grid">
        <input type="text" id="accRegion" placeholder="지역 (예: 가평, 속초, 제주)" />
        <input type="text" id="accName" placeholder="숙소/펜션 이름" />
        <input type="url" id="accLink" placeholder="예약 링크 (https://...)" />
        <input type="number" id="accPrice" placeholder="예상 1박 가격 (원)" />
        <input type="text" id="accMemo" placeholder="특징 (예: 독채풀빌라, 바비큐)" />
        <button class="btn" onclick="addAccommodation()">+ 숙소 추가</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>지역</th>
              <th>숙소명</th>
              <th>예상 1박 요금</th>
              <th>특징 및 메모</th>
              <th>선호도 투표</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="accommodationTableBody">
            <!-- 동적 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. 공동 체크리스트 -->
    <div class="section-card">
      <div class="section-title">
        <span>🎒 공동 체크리스트</span>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="text" id="todoInput" placeholder="추가할 체크리스트 항목을 입력하세요" />
        <button class="btn" onclick="addTodo()">추가</button>
      </div>
      <ul class="checklist" id="todoList"></ul>
    </div>

    <!-- 3. 자유 메모 및 맛집 공유 -->
    <div class="section-card">
      <div class="section-title">
        <span>💬 자유 메모 & 추천 맛집</span>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="text" id="memoAuthor" placeholder="작성자" style="max-width:110px;" />
        <input type="text" id="memoContent" placeholder="식당, 카페, 여행 팁 등 자유롭게 메모를 남겨보세요" />
        <button class="btn" onclick="addMemo()">등록</button>
      </div>
      <div id="memoContainer"></div>
    </div>

  </div>

  <script>
    // 기본 데이터 세팅
    const defaultAccommodations = [
      { id: 1, region: "강릉", name: "세인트존스 호텔", link: "https://map.naver.com", price: 180000, memo: "오션뷰 객실, 인피니티 풀", votes: 2 },
      { id: 2, region: "가평", name: "어반힐스 키즈 풀빌라", link: "https://map.naver.com", price: 320000, memo: "개별 실내 수영장, 바비큐장", votes: 3 }
    ];

    const defaultTodos = [
      { id: 1, text: "아이들 상비약 및 해열제", done: false },
      { id: 2, text: "물놀이 튜브 & 수영복", done: true },
      { id: 3, text: "카메라 & 충전 케이블", done: false }
    ];

    const defaultMemos = [
      { id: 1, author: "도나윤네", text: "첫날 저녁은 펜션 바비큐장에서 고기 구워먹어요!" },
      { id: 2, author: "우진이네", text: "가는 길에 유명한 닭갈비 맛집 들렀다 가면 좋을 것 같아요." }
    ];

    let accommodations = JSON.parse(localStorage.getItem('family_trip_acc')) || defaultAccommodations;
    let todos = JSON.parse(localStorage.getItem('family_trip_todos')) || defaultTodos;
    let memos = JSON.parse(localStorage.getItem('family_trip_memos')) || defaultMemos;

    function saveAndRender() {
      localStorage.setItem('family_trip_acc', JSON.stringify(accommodations));
      localStorage.setItem('family_trip_todos', JSON.stringify(todos));
      localStorage.setItem('family_trip_memos', JSON.stringify(memos));
      renderAccommodations();
      renderTodos();
      renderMemos();
    }

    // 숙소 렌더링 (모든 항목 한 줄 고정)
    function renderAccommodations() {
      const tbody = document.getElementById('accommodationTableBody');
      tbody.innerHTML = '';
      if (accommodations.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">등록된 숙소가 없습니다. 상단에서 추가해보세요!</td></tr>`;
        return;
      }
      accommodations.forEach(item => {
        const tr = document.createElement('tr');
        const linkDisplay = item.link 
          ? `<a href="${item.link}" target="_blank">${item.name} 🔗</a>` 
          : `<strong>${item.name}</strong>`;
        
        tr.innerHTML = `
          <td><span class="region-tag">${item.region}</span></td>
          <td class="acc-name-cell">${linkDisplay}</td>
          <td class="price-tag">${Number(item.price).toLocaleString()}원</td>
          <td style="color:var(--text-muted); font-size:0.86rem; white-space:nowrap;">${item.memo}</td>
          <td>
            <div class="vote-control">
              <button class="vote-btn" onclick="changeVote(${item.id}, -1)" title="투표 감소">-</button>
              <span class="vote-count">👍 ${item.votes}</span>
              <button class="vote-btn" onclick="changeVote(${item.id}, 1)" title="투표 증가">+</button>
            </div>
          </td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteAccommodation(${item.id})">삭제</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addAccommodation() {
      const region = document.getElementById('accRegion').value.trim();
      const name = document.getElementById('accName').value.trim();
      const link = document.getElementById('accLink').value.trim();
      const price = document.getElementById('accPrice').value.trim();
      const memo = document.getElementById('accMemo').value.trim();

      if (!name || !price) {
        alert('숙소 이름과 예상 1박 가격을 입력해주세요.');
        return;
      }

      accommodations.push({
        id: Date.now(),
        region: region || "기타",
        name: name,
        link: link ? (link.startsWith('http') ? link : 'https://' + link) : '',
        price: parseInt(price, 10),
        memo: memo || "-",
        votes: 0
      });

      document.getElementById('accRegion').value = '';
      document.getElementById('accName').value = '';
      document.getElementById('accLink').value = '';
      document.getElementById('accPrice').value = '';
      document.getElementById('accMemo').value = '';

      saveAndRender();
    }

    function deleteAccommodation(id) {
      if (confirm('이 숙소를 목록에서 삭제하시겠습니까?')) {
        accommodations = accommodations.filter(item => item.id !== id);
        saveAndRender();
      }
    }

    function changeVote(id, delta) {
      const target = accommodations.find(item => item.id === id);
      if (target) {
        target.votes = Math.max(0, target.votes + delta);
        saveAndRender();
      }
    }

    // 공동 체크리스트 렌더링
    function renderTodos() {
      const ul = document.getElementById('todoList');
      ul.innerHTML = '';
      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `check-item ${todo.done ? 'done' : ''}`;
        li.innerHTML = `
          <div class="check-left">
            <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
            <label>${todo.text}</label>
          </div>
          <button class="btn btn-sm btn-danger" onclick="deleteTodo(${todo.id})">✕</button>
        `;
        ul.appendChild(li);
      });
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const val = input.value.trim();
      if (!val) return;
      todos.push({ id: Date.now(), text: val, done: false });
      input.value = '';
      saveAndRender();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        saveAndRender();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveAndRender();
    }

    // 메모 렌더링
    function renderMemos() {
      const container = document.getElementById('memoContainer');
      container.innerHTML = '';
      memos.forEach(m => {
        const div = document.createElement('div');
        div.style.cssText = 'background:var(--palette-sand-light); border:1px solid var(--border); padding:10px 14px; border-radius:10px; margin-bottom:8px; font-size:0.88rem; display:flex; justify-content:space-between; align-items:center;';
        div.innerHTML = `
          <div><strong style="color:var(--palette-green); margin-right:6px;">[${m.author || '가족'}]</strong> ${m.text}</div>
          <button class="btn btn-sm btn-danger" onclick="deleteMemo(${m.id})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function addMemo() {
      const author = document.getElementById('memoAuthor').value.trim();
      const content = document.getElementById('memoContent').value.trim();
      if (!content) return;
      memos.push({ id: Date.now(), author: author || '가족', text: content });
      document.getElementById('memoContent').value = '';
      saveAndRender();
    }

    function deleteMemo(id) {
      memos = memos.filter(m => m.id !== id);
      saveAndRender();
    }

    function exportData() {
      const data = { accommodations, todos, memos };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'family_trip_backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // 초기 실행
    saveAndRender();
  </script>
</body>
</html>
